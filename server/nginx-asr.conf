# Распознавание чтения: /api/asr уходит в локальный сервис quran-asr (порт 8090).
# Подключается в server { } сайта quran строкой: include /etc/nginx/snippets/quran-asr.conf;
# Зона limit_req_zone asr объявлена в /etc/nginx/conf.d/quran-asr-zone.conf.
location /api/asr {
    limit_req zone=asr burst=5 nodelay;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:8090;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
