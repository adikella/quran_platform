# Аккаунты, прогресс и сдачи: /api/ уходит в локальный сервис quran-api (порт 8091).
# /api/asr длиннее и остаётся за quran-asr. Подключается в server { } сайта quran:
#   include /etc/nginx/snippets/quran-api.conf;
# Зоны api и apiauth объявлены в /etc/nginx/conf.d/quran-api-zone.conf.
location /api/ {
    limit_req zone=api burst=60 nodelay;
    client_max_body_size 1200k;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
# Вход и коды: реже, чтобы их нельзя было подбирать.
location ~ ^/api/(auth|teachers)/ {
    limit_req zone=apiauth burst=40 nodelay;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
# Запись голоса учителю.
location ~ ^/api/students/[^/]+/submissions$ {
    limit_req zone=apiauth burst=40 nodelay;
    client_max_body_size 42m;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
